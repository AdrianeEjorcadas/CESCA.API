<div class="flex flex-col gap-2">
   <!-- header -->
   <header>
      <div class="bg-light-3 px-4 py-2 text-white grid grid-cols-1 justify-items-end">
         <div class="flex flex-row">
               <i class="fa-solid fa-user"></i>
               <p class="text-xs">{{userName}}</p>
         </div>
      </div>
   </header>
   <!-- content -->
   <section class="px-2">
      <!-- filter -->
      <div class="flex flex-row justify-between items-center">
         <div>
            <mat-form-field class="mat-input-element">
               <mat-label>Product Name</mat-label>
               <input [(ngModel)]="searchParams.searchTerm" matInput title="Product Name" (keyup.enter)="search()">
               <button mat-icon-button matSuffix aria-label="Search" (click)="search()" >
                  <mat-icon>search</mat-icon>
               </button>
            </mat-form-field>
         </div>
         <div class="flex">
            <button 
               (click)="checkCart()"
               title="Check items in Cart" 
               class="cursor-pointer border border-light-1 px-3 py-2 bg-white text-light-1 rounded-2xl hover:bg-light-1 hover:text-white transition-all duration-300">
               <i class="fa-solid fa-shopping-cart "></i>
               <span class="tracking-wider text-xs ">Check Cart</span>
            </button>
         </div>
      </div>

      <!-- product list -->
      <table mat-table [dataSource]="dataSource">
         <!-- Name Column -->
         <ng-container matColumnDef="productName">
            <th mat-header-cell *matHeaderCellDef> Product Name </th>
            <td mat-cell *matCellDef="let element"> {{element.productName}} </td>
         </ng-container>

         <!-- price Column -->
         <ng-container matColumnDef="price">
            <th mat-header-cell *matHeaderCellDef> Price </th>
            <td mat-cell *matCellDef="let element"> ₱{{element.price}} </td>
         </ng-container>

         <!-- quantity Column -->
         <ng-container matColumnDef="quantity">
            <th mat-header-cell *matHeaderCellDef> Quantity </th>
            <td mat-cell *matCellDef="let element"> {{element.quantity}} </td>
         </ng-container>

         <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>  </th>
            <td mat-cell *matCellDef="let element">
               <button matIconButton [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
                  <mat-icon>more_vert</mat-icon>
               </button>
               <mat-menu #menu="matMenu">
                  <button mat-menu-item (click)="addToCart(element)">
                     <mat-icon>add_shopping_cart</mat-icon>
                     <span class="text-light-2">Add {{element.productName}} to Cart</span>
                  </button>
               </mat-menu>
            </td>
         </ng-container>

         <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
         <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
      @if (dataSource.length > 0) {
                <mat-paginator
                    [length]="paginatorMetadata?.totalCount ?? 0"
                    [pageSize]="paginatorMetadata?.pageSize ?? 10"
                    [pageIndex]="(paginatorMetadata?.currentPage ?? 1) - 1"
                    (page)="onPageChange($event)">
                </mat-paginator>
      }
   </section>
 </div>
